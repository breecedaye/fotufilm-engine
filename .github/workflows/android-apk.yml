name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      ANDROID_NDK_HOME: /opt/android-ndk
      LLVM_ROOT: /usr/lib/llvm-22
      SWIFT_TOOLCHAIN: /opt/swift-6.3.3-RELEASE-ubuntu24.04
      HALIDE_ROOT: ${{ github.workspace }}/build/halide-linux-install
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: System packages (LLVM 22 with NVPTX, Vulkan headers, build tools)
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/llvm.gpg
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm22.list
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends \
            llvm-22-dev clang-22 lld-22 liblld-22-dev libclang-22-dev \
            libedit-dev libcurl4-openssl-dev \
            libvulkan-dev cmake ninja-build rsync

      - name: Android NDK r27c
        run: |
          curl -fsSL -o /tmp/ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q /tmp/ndk.zip -d /opt
          mv /opt/android-ndk-r27c /opt/android-ndk
          /opt/android-ndk/ndk-build --version >/dev/null

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Flutter 3.41.7
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.7'

      - name: Halide (pinned submodule + Vulkan patches)
        run: |
          echo "Halide pin: $(git -C third_party/Halide rev-parse HEAD)"
          tools/build-halide-linux.sh
          "$LLVM_ROOT/bin/llvm-config" --version

      - name: Android codecs and FFmpeg (cached)
        uses: actions/cache@v4
        with:
          path: build/android-deps
          key: android-codecs-${{ runner.os }}-${{ hashFiles('tools/build-android-codecs.sh') }}

      - name: Build Android codecs
        run: tools/build-android-codecs.sh

      - name: Swift 6.3.3 toolchain (linux host)
        run: |
          curl -fsSL -o /tmp/swift.tar.gz \
            https://download.swift.org/swift-6.3.3-release/ubuntu2404/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz
          mkdir -p /opt/swift-extract
          tar xzf /tmp/swift.tar.gz -C /opt/swift-extract
          mv /opt/swift-extract/swift-6.3.3-RELEASE-ubuntu24.04 /opt/
          "$SWIFT_TOOLCHAIN/usr/bin/swiftc" --version

      - name: Swift Android SDK (6.3.3 artifact bundle)
        run: |
          # Unpack the artifact bundle straight into where tools/build-android-engine.sh
          # looks for it (the CLI puts it under an XDG path the script does not read).
          curl -fsSL -o /tmp/android-sdk.tar.gz \
            https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz
          echo "d160cc3206dd1886dae3fef2337af5e25ec034692cd0ec225721c56cc69da7f5  /tmp/android-sdk.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.swiftpm/swift-sdks"
          tar xzf /tmp/android-sdk.tar.gz -C "$HOME/.swiftpm/swift-sdks/"
          ls "$HOME/.swiftpm/swift-sdks/"
          ls "$HOME/.swiftpm/swift-sdks/swift-6.3.3-RELEASE_android.artifactbundle/swift-android"

      - name: Build the engine (libfotufilm.so)
        run: |
          export PATH="$LLVM_ROOT/bin:$PATH"
          tools/build-android-engine.sh

      - name: Build the APK
        run: flutter/build-android.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fotufilm-android-apk
          path: build/flutter-host/Fotufilm.apk
          if-no-files-found: error
          retention-days: 14
